name: Deploy na VPS
description: >
  Envia o compose, sobe a imagem nova, espera a saúde e faz rollback se ela não
  responder. Vive numa action composta — e não solta no workflow — para o job de
  recuperação repetir o MESMO deploy num runner novo sem duplicar o script.

inputs:
  ssh_key:          { description: "Chave privada de deploy", required: true }
  host:             { description: "IP da VPS", required: true }
  user:             { description: "Usuário SSH", required: true }
  app_path:         { description: "Diretório do módulo na VPS", required: true }
  compose_file:     { description: "Arquivo compose", required: true }
  health_container: { description: "Container a checar no /up", required: true }

outputs:
  motivo:
    description: "Por que falhou: 'rede' (vale repetir noutro runner) ou 'saude' (não vale)"
    value: ${{ steps.deploy.outputs.motivo }}

runs:
  using: composite
  steps:
    - name: Preparar chave SSH
      shell: bash
      env:
        VPS_SSH_KEY: ${{ inputs.ssh_key }}
      run: |
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

    - name: Enviar compose, subir e checar saúde (com retry e rollback)
      id: deploy
      shell: bash
      env:
        VPS_HOST: ${{ inputs.host }}
        VPS_USER: ${{ inputs.user }}
        APP_PATH: ${{ inputs.app_path }}
        COMPOSE_FILE: ${{ inputs.compose_file }}
        HEALTH_CONTAINER: ${{ inputs.health_container }}
      run: |
        set -euo pipefail
        SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"

        deploy() {
          if [ "$APP_PATH" = "/opt/meu-log" ]; then
            ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" bash -s <<'MIGRATE_MEULOG' || return 1
              set -e
              if [ -d /opt/clew ] && [ ! -d /opt/meu-log ]; then
                docker rm -f ms-clew-web ms-clew-jobs 2>/dev/null || true
                mv /opt/clew /opt/meu-log
                rm -f /opt/meu-log/docker-compose.prod.yml
              fi
              mkdir -p /opt/meu-log
              if [ -f /opt/meu-log/.env ]; then
                sed -i \
                  -e 's/CLEW_DB_USER=clew/MEULOG_DB_USER=meulog/g' \
                  -e 's/CLEW_/MEULOG_/g' \
                  -e 's/clew\.minhasuite\.com/meulog.minhasuite.com/g' \
                  /opt/meu-log/.env
              fi
              if docker ps --format '{{.Names}}' | grep -qx 'ms-postgres'; then
                if docker exec ms-postgres psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'clew';" 2>/dev/null | grep -q 1; then
                  docker exec ms-postgres psql -U postgres -d postgres -c "ALTER ROLE clew RENAME TO meulog;" >/dev/null 2>&1 || true
                fi
                for old_db in $(docker exec ms-postgres psql -U postgres -d postgres -tAc "SELECT datname FROM pg_database WHERE datname LIKE 'clew_production%';" 2>/dev/null); do
                  [ -n "$old_db" ] || continue
                  new_db="meulog_${old_db#clew_}"
                  exists=$(docker exec ms-postgres psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$new_db';" 2>/dev/null || true)
                  if [ -z "$exists" ]; then
                    docker exec ms-postgres psql -U postgres -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$old_db' AND pid <> pg_backend_pid();" >/dev/null 2>&1 || true
                    docker exec ms-postgres psql -U postgres -d postgres -c "ALTER DATABASE \"$old_db\" RENAME TO \"$new_db\";" >/dev/null 2>&1 || true
                  fi
                done
              fi
              if docker volume inspect clew-storage >/dev/null 2>&1 && ! docker volume inspect meulog-storage >/dev/null 2>&1; then
                docker volume create meulog-storage >/dev/null
                docker run --rm -v clew-storage:/from:ro -v meulog-storage:/to alpine sh -c "cp -a /from/. /to/" 2>/dev/null || \
                  docker run --rm -v clew-storage:/from:ro -v meulog-storage:/to ghcr.io/minhasuite/meulog:latest sh -c "cp -a /from/. /to/" 2>/dev/null || true
              fi
              CADDY_SITES=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/sites"}}{{.Source}}{{end}}{{end}}' minhasuite-caddy 2>/dev/null || echo "/opt/caddy/sites")
              if [ -n "$CADDY_SITES" ] && [ -d "$CADDY_SITES" ]; then
                rm -f "$CADDY_SITES/clew.conf"
                printf '%s\n' "# meulog — monitor de erros self-hosted" "meulog.minhasuite.com {" "    encode gzip" "    reverse_proxy ms-meulog-web:3000" "}" > "$CADDY_SITES/meulog.conf"
                docker exec minhasuite-caddy caddy reload --config /etc/caddy/Caddyfile >/dev/null 2>&1 || docker restart minhasuite-caddy >/dev/null 2>&1 || true
              fi
              for f in /opt/*/.env /opt/*/docker-compose*.yml; do
                [ -f "$f" ] || continue
                case "$f" in /opt/meu-log/*) continue ;; esac
                sed -i \
                  -e 's/clew\.minhasuite\.com/meulog.minhasuite.com/g' \
                  -e 's/clew_s_/meulog_s_/g' \
                  -e 's/clew_p_/meulog_p_/g' \
                  -e 's/_CLEW_/_MEULOG_/g' \
                  -e 's/\bCLEW_/MEULOG_/g' \
                  "$f"
              done
        MIGRATE_MEULOG
          fi

          # `|| return 1` explícito: a função é chamada com `set +e` (para
          # capturar o código de saída), então um scp que falha não abortaria
          # sozinho — e o ssh subiria com o compose ANTIGO que já está lá.
          scp $SSH_OPTS "$COMPOSE_FILE" "$VPS_USER@$VPS_HOST:$APP_PATH/" || return 1
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
            set -e
            cd "$APP_PATH"
            C="docker compose -f $COMPOSE_FILE --env-file .env"

            # A imagem que está NO AR agora — é para onde voltamos se a nova
            # subir quebrada. Tem de ser lida antes do pull, senão a tag já
            # aponta para a imagem nova.
            PREV_ID=\$(docker inspect --format '{{.Image}}' $HEALTH_CONTAINER 2>/dev/null || echo "")
            PREV_REF=\$(docker inspect --format '{{.Config.Image}}' $HEALTH_CONTAINER 2>/dev/null || echo "")

            \$C pull

            # `up -d` NÃO pode abortar o script. O compose tem healthcheck
            # próprio e outros serviços dependem dele com `service_healthy`,
            # então quando a versão nova não fica saudável o próprio `up`
            # retorna erro — e com `set -e` o script morria aqui, ANTES da
            # espera ativa e antes do rollback. Descoberto num teste de
            # rollback proposital em 11/08/2026: o dev ficou quebrado e a
            # imagem ruim subiu 4 vezes, porque o rc=1 parecia falha de rede.
            set +e
            \$C up -d
            UP_RC=\$?
            set -e
            if [ \$UP_RC -ne 0 ]; then
              echo "compose up -d retornou \$UP_RC — seguindo para a checagem de saúde"
            fi

            # Espera ativa em vez de "sleep 8": app que roda migration no boot
            # demora mais que isso, e o sleep fixo dava um WARN mentiroso.
            OK=""
            for i in \$(seq 1 30); do
              if docker exec $HEALTH_CONTAINER curl -fsS http://127.0.0.1:3000/up >/dev/null 2>&1; then
                OK=1; break
              fi
              sleep 4
            done

            if [ -n "\$OK" ]; then
              echo "Health $HEALTH_CONTAINER: OK"
              # Só agora: o prune apaga a imagem anterior, que é o alvo do
              # rollback. Antes ele rodava logo depois do 'up' e queimava a
              # única saída que sobrava quando a nova imagem não subia.
              docker image prune -f
              exit 0
            fi

            echo "Health $HEALTH_CONTAINER: FALHOU após 120s"
            docker logs --tail 40 $HEALTH_CONTAINER 2>&1 || true

            if [ -n "\$PREV_ID" ] && [ -n "\$PREV_REF" ]; then
              echo "Voltando para a imagem anterior (\$PREV_ID)"
              docker tag "\$PREV_ID" "\$PREV_REF"
              # Mesmo cuidado do `up` de cima: aqui ele também pode retornar
              # erro (healthcheck do compose) e não pode matar o script antes
              # de a gente conferir e AVISAR em que estado o ar ficou.
              set +e
              \$C up -d
              ROLLBACK_OK=""
              for i in \$(seq 1 20); do
                if docker exec $HEALTH_CONTAINER curl -fsS http://127.0.0.1:3000/up >/dev/null 2>&1; then
                  ROLLBACK_OK=1; break
                fi
                sleep 3
              done
              set -e
              if [ -n "\$ROLLBACK_OK" ]; then
                echo "Rollback OK — o ar está com a versão anterior"
              else
                echo "Rollback NÃO respondeu — precisa de olho humano"
              fi
            else
              echo "Sem imagem anterior conhecida: nada para onde voltar"
            fi

            # 9 = a nova versão subiu e não passou na saúde. Diferente de
            # falha de rede: repetir não muda nada.
            exit 9
        REMOTE
        }

        # Rede entre runner e provedor cai sozinha (06/08/2026: três deploys
        # seguidos com i/o timeout sem UMA tentativa registrada no sshd).
        # 4 tentativas com espera crescente — em 10/08 as 3 antigas, dentro de
        # ~3min, não bastaram e foi preciso rerun na mão.
        for attempt in 1 2 3 4; do
          echo "::group::Tentativa $attempt"
          set +e
          deploy
          rc=$?
          set -e
          echo "::endgroup::"

          if [ $rc -eq 0 ]; then
            exit 0
          fi
          if [ $rc -eq 9 ]; then
            echo "A aplicação não passou na checagem de saúde. Não adianta repetir."
            echo "motivo=saude" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Tentativa $attempt falhou (rc=$rc)."
          case $attempt in
            1) sleep 30 ;;
            2) sleep 60 ;;
            3) sleep 120 ;;
          esac
        done

        echo "Deploy falhou nas 4 tentativas."
        echo "motivo=rede" >> "$GITHUB_OUTPUT"
        exit 1
